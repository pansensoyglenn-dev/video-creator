<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Prompt Builder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Video Prompt Builder</h1>
      <p class="sub">Type your prompts, tap Generate, then paste the code into one Colab cell (GPU runtime).</p>
    </header>

    <form id="form" autocomplete="off">
      <label for="prompt">Prompt</label>
      <textarea id="prompt" rows="6" placeholder="Describe the scene..."></textarea>

      <label for="negative">Negative prompt</label>
      <textarea id="negative" rows="4" placeholder="What to avoid..."></textarea>

      <div class="grid">
        <div>
          <label for="seed">Seed</label>
          <input id="seed" type="number" value="42">
        </div>
        <div>
          <label for="pick">Keyframe pick</label>
          <select id="pick">
            <option value="0">0</option>
            <option value="1" selected>1</option>
            <option value="2">2</option>
          </select>
        </div>
        <div>
          <label for="clips">Clips (≈3s each)</label>
          <input id="clips" type="number" min="1" max="4" value="2">
        </div>
        <div>
          <label for="motion">Motion (30–200)</label>
          <input id="motion" type="number" min="30" max="200" value="90">
        </div>
      </div>

      <label for="outname">Output file name</label>
      <input id="outname" type="text" value="output_6s.mp4">

      <button type="submit" class="primary">Generate code</button>
    </form>

    <section id="result" hidden>
      <h2>Your Colab code</h2>
      <textarea id="code" rows="12" readonly></textarea>
      <div class="actions">
        <button id="copy" type="button" class="primary">Copy code</button>
        <a class="btn" href="https://colab.research.google.com/#create=true" target="_blank" rel="noopener">Open Colab</a>
      </div>
      <p class="hint">In Colab: Runtime → Change runtime type → GPU, paste into a cell, then run it.</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
